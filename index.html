<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Rush - Fast Paced Color Game</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <!-- Header -->
        <header class="game-header">
            <h1 class="game-title">COLOR RUSH</h1>
            <div class="stats">
                <div class="stat">
                    <span class="stat-label">Score</span>
                    <span id="score" class="stat-value">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Level</span>
                    <span id="level" class="stat-value">1</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Time</span>
                    <span id="timer" class="stat-value">30</span>
                </div>
            </div>
        </header>

        <!-- Game Area -->
        <div class="game-area">
            <!-- Target Color Display -->
            <div class="target-section">
                <h2>Match This Color!</h2>
                <div id="target-color" class="target-color"></div>
                <div class="color-name" id="color-name">Red</div>
            </div>

            <!-- Color Grid -->
            <div class="color-grid" id="color-grid">
                <!-- Color tiles will be generated here -->
            </div>

            <!-- Game Messages -->
            <div id="message" class="message"></div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button id="start-btn" class="btn btn-primary">Start Game</button>
            <button id="pause-btn" class="btn btn-secondary" style="display: none;">Pause</button>
            <button id="restart-btn" class="btn btn-danger" style="display: none;">Restart</button>
        </div>

        <!-- Game Over Modal -->
        <div id="game-over-modal" class="modal">
            <div class="modal-content">
                <h2>Game Over!</h2>
                <div class="final-stats">
                    <p>Final Score: <span id="final-score">0</span></p>
                    <p>Level Reached: <span id="final-level">1</span></p>
                </div>
                <button id="play-again-btn" class="btn btn-primary">Play Again</button>
            </div>
        </div>

        <!-- Particle Effects Container -->
        <div id="particles"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
